# =============================================================
# 星栈 · 项目主站 Nginx 配置（单域名多路径 + HTTPS）
# -------------------------------------------------------------
# 部署结构：
#   https://你的域名/            → 星栈主站（项目大厅 + 评测 OJ，dist/ 构建产物）
#   https://你的域名/jieya/      → 界芽计划（独立网页应用，构建产物目录）
#   StarCode（桌面应用）         → 不在网页端运行，主站卡片提供下载/启动说明
#
# 用法：
#   1. 把 server_name 改成你的真实域名，路径改成服务器上的实际目录
#   2. 主站：npm run build 后把 dist/ 部署到 $root/starstack-dist
#   3. 界芽计划：cd ~/Desktop/界芽计划 && npm run build 后把 dist/ 拷到
#      $root/jieya-dist（注意其构建支持 base path，部署到子路径 /jieya/）
#   4. 后端：node server/index.js（Express，端口 5174），用 PM2 托管
#      （pm2 start ecosystem.config.js --env production）
#   5. HTTPS：用 certbot 一键签发：certbot --nginx -d 你的域名
#      （证书签发后 certbot 会自动改写 80 端口 server 块为 443 跳转，
#        也可手动启用下方 https_server 模板）
# =============================================================

# ---------- HTTP：全站跳转 HTTPS（certbot 签发后自动处理，二选一） ----------
server {
    listen 80;
    server_name 你的域名.example.com;  # TODO: 改成真实域名

    # 未配证书时直接提供服务（开发/内网场景），配好证书后改为跳转：
    # return 301 https://$host$request_uri;

    root /var/www/starstack-dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss;

    # ---------- 星栈主站（项目大厅 + 评测 OJ） ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 界芽计划（独立网页应用，子路径托管） ----------
    location /jieya/ {
        alias /var/www/jieya-dist/;
        try_files $uri $uri/ /jieya/index.html;
    }

    # ---------- 后端 API（Express 端口 5174） ----------
    location /api/ {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

