# Production Hydra PostgreSQL accepts only TLS + SCRAM from its internal network.
local   all      all                        scram-sha-256
hostssl hydra    hydra    0.0.0.0/0         scram-sha-256
hostssl hydra    hydra    ::/0              scram-sha-256
host    all      all      0.0.0.0/0         reject
host    all      all      ::/0              reject
