# Merge this server into the existing 1Panel/Nginx TLS layout. Do not install it
# until the certificate paths and authoritative DNS/origin topology have been checked.
server {
    listen 80;
    listen [::]:80;
    server_name auth.xingzhan.cc;

    server_tokens off;
    client_max_body_size 1k;
    # Identity query strings must not enter the default request log, including
    # before HTTPS redirection is applied.
    access_log off;

    # Certbot/acme.sh webroot only. Nginx treats HEAD as part of GET handling;
    # every mutating or unsupported method is rejected before file lookup.
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/acme;
        default_type text/plain;
        autoindex off;
        limit_except GET {
            deny all;
        }
        try_files $uri =404;
    }

    location / {
        return 308 https://auth.xingzhan.cc$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.xingzhan.cc;

    ssl_certificate /etc/letsencrypt/live/auth.xingzhan.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.xingzhan.cc/privkey.pem;
    server_tokens off;
    client_max_body_size 64k;
    # Authorization/login challenges, state and nonce must not enter the
    # default $request access log (which includes the full query string).
    access_log off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /internal/oidc/ {
        return 404;
    }

    location = /.well-known/openid-configuration {
        proxy_pass http://127.0.0.1:5174;
        proxy_set_header Host auth.xingzhan.cc;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 15s;
    }

    location = /.well-known/jwks.json {
        proxy_pass http://127.0.0.1:5174;
        proxy_set_header Host auth.xingzhan.cc;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 15s;
    }

    location ~ ^/oauth2/(?:auth|token|revoke|userinfo|sessions/logout)$ {
        proxy_pass http://127.0.0.1:5174;
        proxy_set_header Host auth.xingzhan.cc;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 15s;
    }

    location ~ ^/account/(?:login|consent|logout|logout/login|error)$ {
        proxy_pass http://127.0.0.1:5174;
        proxy_set_header Host auth.xingzhan.cc;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 15s;
    }

    location / {
        return 404;
    }
}
