# Merge this server into the existing 1Panel/Nginx TLS layout. Do not install it
# until the certificate paths and Cloudflare/origin topology have been checked.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.xingzhan.cc;

    ssl_certificate /etc/letsencrypt/live/auth.xingzhan.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.xingzhan.cc/privkey.pem;
    server_tokens off;
    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ^~ /internal/oidc/ {
        return 404;
    }

    location = /.well-known/openid-configuration {
        proxy_pass http://127.0.0.1:5174;
        proxy_set_header Host auth.xingzhan.cc;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 15s;
    }

    location = /.well-known/jwks.json {
        proxy_pass http://127.0.0.1:5174;
        proxy_set_header Host auth.xingzhan.cc;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 15s;
    }

    location ~ ^/oauth2/(?:auth|token|revoke|userinfo|sessions/logout)$ {
        proxy_pass http://127.0.0.1:5174;
        proxy_set_header Host auth.xingzhan.cc;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 15s;
    }

    location ~ ^/account/(?:login|consent|logout|logout/login|error)$ {
        proxy_pass http://127.0.0.1:5174;
        proxy_set_header Host auth.xingzhan.cc;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 15s;
    }

    location / {
        return 404;
    }
}
