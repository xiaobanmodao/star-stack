<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'">
  <meta name="referrer" content="no-referrer">
  <title>旧登录桥接已停用 · 星栈</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #050816; color: #eef2ff; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 10%, #172554 0, transparent 38%), #050816; }
    main { width: min(460px, 100%); padding: 28px; border: 1px solid #334155; border-radius: 20px; background: rgba(15, 23, 42, .94); box-shadow: 0 24px 80px rgba(0, 0, 0, .45); }
    h1 { margin: 0 0 10px; font-size: 1.4rem; }
    p { margin: 0; color: #cbd5e1; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <h1>旧登录桥接已停用</h1>
    <p>星栈不再通过网页、跨窗口消息或 URL 共享登录凭据。请返回目标应用，并选择“使用星栈账号”通过安全的 OpenID Connect 流程登录。</p>
  </main>
</body>
</html>
