name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Production dependency audit
        run: npm run audit:deps

      - name: Server syntax smoke check
        run: |
          node --check server/index.js
          node --check server/controllers/submissionsController.js
          node --check server/controllers/problemsController.js
          node --check server/controllers/adminController.js
          node --check server/judge.js

      - name: Start API for smoke test
        run: |
          PORT=5180 NODE_ENV=test node server/index.js > /tmp/starstack-api.log 2>&1 &
          sleep 2

      - name: API smoke test
        run: SMOKE_BASE_URL=http://127.0.0.1:5180 npm run test:smoke
