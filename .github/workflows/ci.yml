name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Server syntax smoke check
        run: |
          node --check server/index.js
          node --check server/controllers/submissionsController.js
          node --check server/controllers/problemsController.js
          node --check server/controllers/adminController.js
          node --check server/judge.js
